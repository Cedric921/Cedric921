name: Update open-source contributions

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/oss-projects.json
      - .github/scripts/update-oss.mjs

jobs:
  update-oss:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Merged / open PRs, stars and newly contributed projects → README.md
      - name: Refresh open-source table
        run: node .github/scripts/update-oss.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}

      - name: Commit README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: refresh open-source contributions [skip ci]"
          file_pattern: "README.md"
